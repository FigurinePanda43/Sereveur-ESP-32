services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: esp32-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/devices.db
      - CADDY_ADMIN_URL=http://caddy:2019
      # Chemin du projet sur l'HÔTE. Le conteneur de mise à jour s'y monte au
      # même chemin : Compose y tourne, mais les bind-mounts relatifs
      # (./frontend, ./caddy/Caddyfile) sont résolus par le démon de l'hôte.
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH:-/root/Sereveur-ESP-32}
      - HOST_SSH_DIR=${HOST_SSH_DIR:-/root/.ssh}
    volumes:
      - db_data:/data
      - ./frontend:/app/frontend:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_PATH:-/root/Sereveur-ESP-32}:/host-project
      # Clé de déploiement en lecture seule : sans elle, le git fetch de
      # /api/system/update-check échoue sur un dépôt privé en SSH et le badge
      # « mise à jour disponible » ne s'affiche jamais.
      - ${HOST_SSH_DIR:-/root/.ssh}:/root/.ssh:ro
    depends_on:
      - caddy
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: esp32-caddy
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: esp32-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - internal

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
