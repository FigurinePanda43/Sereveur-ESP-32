<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Connexion — Services locaux</title>
  <link rel="stylesheet" href="/css/style.css?v=20">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sereveur-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-mark" aria-hidden="true">⚡</div>
    <h1 class="login-title">Services locaux</h1>
    <p class="login-sub">Connectez-vous pour administrer vos équipements.</p>

    <div class="login-error" id="login-error" hidden>
      <span aria-hidden="true">⚠</span><span>Identifiant ou mot de passe incorrect.</span>
    </div>
    <div class="login-error" id="login-error-expired" hidden>
      <span aria-hidden="true">⌛</span><span>Ce compte a expiré. Contactez l'administrateur.</span>
    </div>
    <div class="login-error" id="login-error-disabled" hidden>
      <span aria-hidden="true">⏸</span><span>Ce compte est désactivé. Contactez l'administrateur.</span>
    </div>

    <form class="login-form" method="POST" action="/auth/login">
      <input type="hidden" name="next" id="next-field" value="/">
      <div class="field">
        <label for="username">Identifiant</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus
               autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Se connecter</button>
    </form>
  </main>

  <script src="/js/motion.js?v=1"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get("error");
    if (err === "expired") document.getElementById("login-error-expired").hidden = false;
    else if (err === "disabled") document.getElementById("login-error-disabled").hidden = false;
    else if (err) document.getElementById("login-error").hidden = false;
    if (params.get("next")) document.getElementById("next-field").value = params.get("next");

    Motion.installPressFeedback();
  </script>
</body>
</html>
